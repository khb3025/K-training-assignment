services:
  assignment-server:
    build: .
    ports: ["8080:8080"]
    depends_on:
      assignment-db:
        condition: "service_healthy"

  assignment-db:
    image: mysql:latest
    container_name: assignment-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: assignment-db
      MYSQL_USER: assignment
      MYSQL_PASSWORD: assignment
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s